
[project]
name = "selenic-api"
version = "0.9.1"
description = "SELENIC lunar site comparison and surface power simulation API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "numpy>=1.26,<3.0",
    "rasterio>=1.3,<2.0",
    "pyproj>=3.6,<4.0",
]

[tool.vercel]
entrypoint = "app.main:app"

